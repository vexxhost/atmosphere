- name: Check that the resources survived the upgrade
  ansible.builtin.import_playbook: check-workload.yml

- name: DNM collect Cinder scheduling diagnostics
  hosts: controllers[0]
  become: true
  tasks:
    - name: DNM dump state and try remedies
      ansible.builtin.shell: |
        set +e
        out=/tmp/logs/system/atmosphere-upgrade/cinder-debug.txt
        mkdir -p $(dirname $out)
        pools() {
          /usr/bin/python3 - <<'PY'
        import openstack
        conn = openstack.connect(cloud="atmosphere")
        pools = list(conn.block_storage.backend_pools(details=True))
        print("pools:", len(pools), [p.name for p in pools])
        PY
        }
        rmq() {
          kubectl -n openstack exec rabbitmq-cinder-server-0 -c rabbitmq -- rabbitmqctl -q -p cinder "$@" 2>&1
        }
        dump() {
          echo "== $1 $(date -u +%T)"
          pools
          echo "-- exchanges"; rmq list_exchanges name type durable auto_delete internal
          echo "-- bindings from fanout exchanges"; rmq list_bindings source_name destination_name | grep -i fanout
          echo "-- queues"; rmq list_queues name durable auto_delete messages consumers | grep -E 'scheduler|volume'
        }
        restart_cinder() {
          kubectl -n openstack rollout restart deploy/cinder-scheduler deploy/cinder-volume
          kubectl -n openstack rollout status deploy/cinder-scheduler --timeout=600s
          kubectl -n openstack rollout status deploy/cinder-volume --timeout=600s
          sleep 150
        }
        {
          dump "after upgrade"
          echo "-- rabbitmq versions/flags"; kubectl -n openstack exec rabbitmq-cinder-server-0 -c rabbitmq -- rabbitmqctl -q list_feature_flags name state 2>&1 | grep -iE 'khepri|disabled' | head
          restart_cinder
          dump "after restarting cinder-scheduler and cinder-volume"
          kubectl -n openstack delete pod rabbitmq-cinder-server-0
          sleep 20
          kubectl -n openstack wait --for=condition=Ready pod/rabbitmq-cinder-server-0 --timeout=600s
          kubectl -n openstack logs rabbitmq-cinder-server-0 -c rabbitmq 2>&1 | grep -E 'Could not find exchange type|transient queues' | head
          restart_cinder
          dump "after restarting RabbitMQ and then cinder"
        } > $out 2>&1
      environment:
        KUBECONFIG: /root/.kube/config
      changed_when: false
      failed_when: false

- name: Run Tempest tests
  ansible.builtin.import_playbook: vexxhost.atmosphere.tempest
