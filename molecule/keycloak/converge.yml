- hosts: controllers
  become: true
  roles:
    - vexxhost.atmosphere.cert_manager
    - vexxhost.atmosphere.cluster_issuer
    - vexxhost.atmosphere.ingress_nginx
    - vexxhost.atmosphere.cloudnative_pg
    - vexxhost.atmosphere.rabbitmq_cluster_operator
    - vexxhost.atmosphere.percona_xtradb_cluster_operator
    - vexxhost.atmosphere.percona_xtradb_cluster
    - vexxhost.atmosphere.memcached

- name: Deploy Keycloak
  hosts: controllers[0]
  become: true
  tasks:
    - name: Get existing Keycloak StatefulSet
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path | default('/etc/kubernetes/admin.conf') }}"
        api_version: apps/v1
        kind: StatefulSet
        name: keycloak
        namespace: auth-system
      register: _keycloak_existing_statefulset

    - name: Detect operator-managed Keycloak StatefulSet
      ansible.builtin.set_fact:
        _keycloak_operator_instance_exists: >-
          {{
            _keycloak_existing_statefulset.resources | length == 1 and
            _keycloak_existing_statefulset.resources[0].metadata.ownerReferences | default([]) |
            selectattr('kind', 'equalto', 'Keycloak') | list | length == 1
          }}

    - name: Deploy Keycloak with PXC
      when: not _keycloak_operator_instance_exists
      ansible.builtin.import_role:
        name: vexxhost.atmosphere.keycloak
        tasks_from: database_before_migration

    - name: Deploy current Keycloak role
      ansible.builtin.import_role:
        name: vexxhost.atmosphere.keycloak

- name: Deploy OpenStack services
  hosts: controllers
  become: true
  roles:
    - vexxhost.atmosphere.kube_prometheus_stack
    - vexxhost.atmosphere.keystone
    - vexxhost.atmosphere.horizon
