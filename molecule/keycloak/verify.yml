- name: Create user and assert it exists inside Keystone
  hosts: all
  tasks:
    - name: Get Keycloak Operator CRDs
      run_once: true
      become: true
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path | default('/etc/kubernetes/admin.conf') }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
      loop:
        - keycloaks.k8s.keycloak.org
        - keycloakrealmimports.k8s.keycloak.org
      register: _keycloak_operator_crds

    - name: Assert Keycloak Operator CRDs are installed
      run_once: true
      ansible.builtin.assert:
        that:
          - _keycloak_operator_crds.results | map(attribute='resources') | map('length') | list == [1, 1]

    - name: Get Keycloak Operator deployment
      run_once: true
      become: true
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path | default('/etc/kubernetes/admin.conf') }}"
        api_version: apps/v1
        kind: Deployment
        name: keycloak-operator
        namespace: auth-system
      register: _keycloak_operator_deployment

    - name: Assert Keycloak Operator is ready
      run_once: true
      ansible.builtin.assert:
        that:
          - _keycloak_operator_deployment.resources | length == 1
          - _keycloak_operator_deployment.resources[0].status.availableReplicas == 1

    - name: Create Keycloak user
      run_once: true
      delegate_to: localhost
      community.general.keycloak_user:
        # Keycloak settings
        auth_keycloak_url: "https://{{ keycloak_host }}"
        auth_realm: master
        auth_client_id: admin-cli
        auth_username: admin
        auth_password: "{{ keycloak_admin_password }}"
        validate_certs: "{{ cluster_issuer_type != 'self-signed' }}"
        # User settings
        realm: atmosphere
        username: test-user
      register: keycloak_user_result

    - name: Set a fact with user information using "end_state" or "existing"
      run_once: true
      ansible.builtin.set_fact:
        keycloak_user_info: "{{ keycloak_user_result.existing | ternary(keycloak_user_result.existing, keycloak_user_result.end_state) }}"

    - name: Get list of all users in "atmosphere" domain
      run_once: true
      delegate_to: localhost
      vexxhost.atmosphere.identity_user_info:
        domain: atmosphere
        name: "{{ keycloak_user_info.username }}"
      register: identity_user_info_result
      # XXX(mnaser): GHA seems to be slow so the user doesn't show up right
      #              away, it could also be a Keystone caching issue.  Poll
      #              less aggressively and give Keystone up to five minutes to
      #              see the federated Keycloak user.
      retries: 30
      delay: 10
      until: identity_user_info_result.users | length > 0

    - name: Assert that the user exists
      run_once: true
      ansible.builtin.assert:
        that:
          - identity_user_info_result.users | length > 0
          - identity_user_info_result.users[0].id == keycloak_user_info.id | regex_replace('-', '')
          - identity_user_info_result.users[0].name == keycloak_user_info.username

    # TODO: Simulate Keystone authentication
    # TODO: Simulate Horizon login
