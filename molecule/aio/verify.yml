- name: Run tests
  hosts: localhost
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Run "stestr" tests
      when: >-
        {{
          lookup('env', 'ATMOSPHERE_CI_RUN_STESTR')
          | default('true', true)
          | bool
        }}
      become: true
      ansible.builtin.shell: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/.venv/bin/stestr run"
      args:
        chdir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      environment:
        KUBECONFIG: /root/.kube/config
        ATMOSPHERE_NETWORK_BACKEND: "{{ atmosphere_network_backend }}"

- name: Verify selected OpenStack APIs
  hosts: controllers[0]
  gather_facts: false
  become: true
  vars:
    _atmosphere_ci_verification_checks: >-
      {{
        lookup('env', 'ATMOSPHERE_CI_VERIFICATION_CHECKS')
        | default('[]', true)
        | from_json
      }}
    _atmosphere_ci_openstack_resource_checks: >-
      {{
        _atmosphere_ci_verification_checks
        | selectattr('kind', 'equalto', 'openstack-resource')
        | list
      }}
    _atmosphere_ci_openstack_cli_checks: >-
      {{
        _atmosphere_ci_verification_checks
        | selectattr('kind', 'equalto', 'openstack-cli')
        | list
      }}
    _atmosphere_ci_kubernetes_deployment_checks: >-
      {{
        _atmosphere_ci_verification_checks
        | selectattr('kind', 'equalto', 'kubernetes-deployment')
        | list
      }}
  tasks:
    - name: Query selected OpenStack service resources
      openstack.cloud.resources:
        cloud: atmosphere
        service: "{{ item.service }}"
        type: "{{ item.type }}"
      loop: "{{ _atmosphere_ci_openstack_resource_checks }}"
      loop_control:
        label: "{{ item.service }}/{{ item.type }}"

    - name: Run selected OpenStack client commands
      ansible.builtin.command:
        argv: >-
          {{
            [
              '/bin/bash',
              '-c',
              '. /root/openrc && exec openstack "$@"',
              'openstack'
            ]
            + item.arguments
          }}
      changed_when: false
      loop: "{{ _atmosphere_ci_openstack_cli_checks }}"
      loop_control:
        label: "openstack {{ item.arguments | join(' ') }}"

    - name: Wait for selected Kubernetes deployments
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      register: _atmosphere_ci_deployment
      until:
        - _atmosphere_ci_deployment.resources | length == 1
        - >-
          _atmosphere_ci_deployment.resources[0].status.availableReplicas
          | default(0) | int
          >=
          _atmosphere_ci_deployment.resources[0].spec.replicas
          | default(1) | int
      retries: 60
      delay: 5
      loop: "{{ _atmosphere_ci_kubernetes_deployment_checks }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"

- name: Run Tempest tests
  ansible.builtin.import_playbook: vexxhost.atmosphere.tempest
  tags:
    - always
