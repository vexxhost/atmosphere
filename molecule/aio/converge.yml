---
- hosts: all
  gather_facts: false
  tasks:
    - name: Build atmosphere binary
      ansible.builtin.command:
        cmd: go build -o ./bin/atmosphere ./cmd/atmosphere
      args:
        chdir: "{{ zuul.project.src_dir | default(playbook_dir + '/../..') }}"
      run_once: true
      changed_when: false
      environment:
        CGO_ENABLED: "0"
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH | default(lookup('env', 'PATH')) }}"

    - name: Generate selective CI plan artifact
      when: atmosphere_ci_plan_shadow | default(false) | bool
      ansible.builtin.command:
        argv:
          - ./bin/atmosphere
          - ci
          - plan
          - --base
          - "{{ atmosphere_ci_plan_base }}"
          - --head
          - "{{ atmosphere_ci_plan_head | default('HEAD') }}"
          - --format
          - json
          - --output
          - ./ci-plan.json
      args:
        chdir: "{{ zuul.project.src_dir | default(playbook_dir + '/../..') }}"
      run_once: true
      changed_when: false
      failed_when: false
      register: _atmosphere_ci_plan_artifact

    - name: Explain selective CI plan
      when:
        - atmosphere_ci_plan_shadow | default(false) | bool
        - _atmosphere_ci_plan_artifact.rc == 0
      ansible.builtin.command:
        argv:
          - ./bin/atmosphere
          - ci
          - plan
          - --base
          - "{{ atmosphere_ci_plan_base }}"
          - --head
          - "{{ atmosphere_ci_plan_head | default('HEAD') }}"
      args:
        chdir: "{{ zuul.project.src_dir | default(playbook_dir + '/../..') }}"
      run_once: true
      changed_when: false
      failed_when: false
      register: _atmosphere_ci_plan_explanation

    - name: Create selective CI plan log directory
      when:
        - atmosphere_ci_plan_shadow | default(false) | bool
        - _atmosphere_ci_plan_artifact.rc == 0
      ansible.builtin.file:
        path: /tmp/logs
        state: directory
        mode: "0755"

    - name: Publish selective CI plan with job logs
      when:
        - atmosphere_ci_plan_shadow | default(false) | bool
        - _atmosphere_ci_plan_artifact.rc == 0
      ansible.builtin.copy:
        src: "{{ zuul.project.src_dir | default(playbook_dir + '/../..') }}/ci-plan.json"
        dest: /tmp/logs/ci-plan.json
        remote_src: true
        mode: "0644"

    - name: Print selective CI plan
      when:
        - atmosphere_ci_plan_shadow | default(false) | bool
        - _atmosphere_ci_plan_artifact.rc == 0
      ansible.builtin.debug:
        var: _atmosphere_ci_plan_explanation.stdout_lines

    - name: Report selective CI shadow planning failure
      when:
        - atmosphere_ci_plan_shadow | default(false) | bool
        - _atmosphere_ci_plan_artifact.rc != 0
      ansible.builtin.debug:
        msg: >-
          Selective CI shadow planning failed and the complete deployment will
          continue: {{ _atmosphere_ci_plan_artifact.stderr }}

    - name: Deploy with parallel orchestrator
      ansible.builtin.shell:
        cmd: >
          . .venv/bin/activate &&
          ./bin/atmosphere deploy
          --inventory ./inventory.yaml
          {{ '--tags ' + atmosphere_deploy_tags if atmosphere_deploy_tags is defined else '' }}
          --dependency-option csi_driver={{ csi_driver | default('rbd') | quote }}
          --dependency-option network_backend={{ atmosphere_network_backend | default('openvswitch') | quote }}
        executable: /bin/bash
      args:
        chdir: "{{ zuul.project.src_dir | default(playbook_dir + '/../..') }}"
      run_once: true
      changed_when: false

- name: Configure networking
  hosts: all
  become: true
  tasks:
    - name: Add IP address to "br-ex"
      changed_when: false
      ansible.builtin.shell:
        cmd: ip addr add 10.96.250.10/24 dev br-ex || true

    - name: Set "br-ex" interface to "up"
      changed_when: false
      ansible.builtin.shell:
        cmd: ip link set br-ex up || true
