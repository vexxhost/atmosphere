suite: runtimeclass
tests:
  - it: should support not having a runtime class
    templates:
      - templates/deployment-api.yaml
      - templates/deployment-novncproxy.yaml
      - templates/statefulset-conductor.yaml
      - templates/job-db-sync.yaml
      - templates/job-bootstrap.yaml
    set:
      manifests:
        deployment_novncproxy: true
    asserts:
      - template: templates/deployment-api.yaml
        documentIndex: 3
        notExists:
          path: spec.template.spec.runtimeClassName
      - template: templates/deployment-novncproxy.yaml
        documentSelector:
          path: kind
          value: Deployment
        notExists:
          path: spec.template.spec.runtimeClassName
      - template: templates/statefulset-conductor.yaml
        documentIndex: 3
        notExists:
          path: spec.template.spec.runtimeClassName
      - template: templates/job-db-sync.yaml
        documentIndex: 3
        notExists:
          path: spec.template.spec.runtimeClassName
      - template: templates/job-bootstrap.yaml
        documentIndex: 3
        notExists:
          path: spec.template.spec.runtimeClassName

  - it: should support setting a runtime class
    templates:
      - templates/deployment-api.yaml
      - templates/deployment-novncproxy.yaml
      - templates/statefulset-conductor.yaml
      - templates/job-db-sync.yaml
      - templates/job-bootstrap.yaml
    set:
      manifests:
        deployment_novncproxy: true
      pod:
        runtimeClassName:
          ironic_api: kata-clh
          ironic_novncproxy: kata-clh
          ironic_conductor: kata-clh
          db_sync: kata-clh
          bootstrap: kata-clh
    asserts:
      - template: templates/deployment-api.yaml
        documentIndex: 3
        equal:
          path: spec.template.spec.runtimeClassName
          value: kata-clh
      - template: templates/deployment-novncproxy.yaml
        documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.runtimeClassName
          value: kata-clh
      - template: templates/statefulset-conductor.yaml
        documentIndex: 3
        equal:
          path: spec.template.spec.runtimeClassName
          value: kata-clh
      - template: templates/job-db-sync.yaml
        documentIndex: 3
        equal:
          path: spec.template.spec.runtimeClassName
          value: kata-clh
      - template: templates/job-bootstrap.yaml
        documentIndex: 3
        equal:
          path: spec.template.spec.runtimeClassName
          value: kata-clh
