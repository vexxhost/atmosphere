_ironic_helm_values:
  console:
    namespace: "{{ ironic_vnc_namespace }}"
    pod:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    container:
      ports:
        - name: rfb
          containerPort: 5900
        - name: health
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /readyz
          port: health
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: health
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      env: >-
        {{
          [
            {
              'name': 'ALLOW_INSECURE_TRANSPORT',
              'value': ironic_vnc_allow_insecure_transport | bool | string | lower
            },
            {
              'name': 'ALLOW_INSECURE_TLS',
              'value': ironic_vnc_allow_insecure_tls | bool | string | lower
            },
            {'name': 'BMC_TLS_MINIMUM_VERSION', 'value': ironic_vnc_tls_minimum_version | string},
            {'name': 'CONNECT_TIMEOUT', 'value': ironic_vnc_connect_timeout | string},
            {'name': 'HANDSHAKE_TIMEOUT', 'value': ironic_vnc_handshake_timeout | string},
            {'name': 'IDLE_TIMEOUT', 'value': ironic_vnc_idle_timeout | string},
            {'name': 'SESSION_TIMEOUT', 'value': ironic_vnc_session_timeout | string},
            {'name': 'READINESS_INTERVAL', 'value': ironic_vnc_readiness_interval | string},
            {'name': 'MAX_CLIENTS', 'value': ironic_vnc_max_clients | string},
            {'name': 'MAX_CLIENTS_PER_SOURCE', 'value': ironic_vnc_max_clients_per_source | string},
            {'name': 'KEYBOARD_MODE', 'value': ironic_vnc_keyboard_mode | string},
            {
              'name': 'KEYBOARD_DIAGNOSTICS',
              'value': ironic_vnc_keyboard_diagnostics | bool | string | lower
            },
            {
              'name': 'PRINTABLE_KEY_HOLD',
              'value': ironic_vnc_printable_key_hold | float | string
            },
            {
              'name': 'PRINTABLE_KEY_INTERVAL',
              'value': ironic_vnc_printable_key_interval | float | string
            }
          ]
          + (
            [{'name': 'BMC_TLS_CIPHERS', 'value': ironic_vnc_tls_ciphers | string}]
            if ironic_vnc_tls_ciphers
            else []
          )
          + (
            [
              {
                'name': 'BMC_CA_FILE',
                'value': ironic_vnc_ca_mount_path ~ '/' ~ ironic_vnc_ca_secret_key
              }
            ]
            if ironic_vnc_ca_secret_name
            else []
          )
        }}
      volumeMounts: >-
        {{
          [
            {
              'name': 'bmc-ca',
              'mountPath': ironic_vnc_ca_mount_path,
              'readOnly': true
            }
          ]
          if ironic_vnc_ca_secret_name
          else []
        }}
    volumes: >-
      {{
        [
          {
            'name': 'bmc-ca',
            'secret': {
              'secretName': ironic_vnc_ca_secret_name,
              'items': [
                {
                  'key': ironic_vnc_ca_secret_key,
                  'path': ironic_vnc_ca_secret_key
                }
              ]
            }
          }
        ]
        if ironic_vnc_ca_secret_name
        else []
      }}
  endpoints: "{{ openstack_helm_endpoints }}"
  images:
    tags: "{{ atmosphere_images | vexxhost.atmosphere.openstack_helm_image_tags('ironic') }}"
  bootstrap:
    image:
      enabled: false
    network:
      enabled: false
    object_store:
      enabled: false
  dependencies:
    static:
      api:
        jobs:
          - ironic-db-sync
          - ironic-ks-user
          - ironic-ks-endpoints
          - ironic-rabbit-init
          # NOTE(mnaser): We're managing all the networks via Ansible.
          # - ironic-manage-cleaning-network
      conductor:
        jobs:
          - ironic-db-sync
          - ironic-ks-user
          - ironic-ks-endpoints
          - ironic-rabbit-init
          # NOTE(mnaser): We're managing all the networks via Ansible.
          # - ironic-manage-cleaning-network
  conf:
    ironic:
      DEFAULT:
        log_config_append: null
        enabled_hardware_types: "{{ ironic_enabled_hardware_types if ironic_enabled_hardware_types else omit }}"
        enabled_console_interfaces: "{{ ironic_enabled_console_interfaces if ironic_vnc_enabled | bool else omit }}"
        enabled_network_interfaces: "{{ ironic_enabled_network_interfaces }}"
        default_network_interface: flat
        rbac_service_role_elevated_access: true
      conductor:
        clean_step_priority_override: deploy.erase_devices_express:5
        deploy_kernel: "{{ ironic_python_agent_deploy_kernel.images.0.id }}"
        deploy_ramdisk: "{{ ironic_python_agent_deploy_ramdisk.images.0.id }}"
      database:
        connection_recycle_time: 600
        max_overflow: 50
        max_pool_size: 5
        pool_timeout: 30
      deploy:
        erase_devices_priority: 0
        erase_devices_metadata_priority: 0
      neutron:
        cleaning_network: "{{ ironic_bare_metal_network_name }}"
        inspection_network: "{{ ironic_bare_metal_network_name }}"
        provisioning_network: "{{ ironic_bare_metal_network_name }}"
        rescuing_network: "{{ ironic_bare_metal_network_name }}"
      pxe:
        kernel_append_params: "ipa-insecure=true systemd.journald.forward_to_console=yes"
      service_catalog:
        valid_interfaces: public
      vnc:
        enabled: "{{ ironic_vnc_enabled | bool }}"
        public_url: "{{ ironic_vnc_public_url if ironic_vnc_enabled | bool else omit }}"
        token_timeout: "{{ ironic_vnc_token_timeout }}"
        novnc_web: "{{ ironic_vnc_novnc_web }}"
        container_provider: "{{ ironic_vnc_container_provider }}"
        console_image: "{{ atmosphere_images.get('ironic_console', omit) }}"
        kubernetes_container_template: >-
          {{
            '/etc/ironic/ironic-console-pod.yaml'
            if (
              ironic_vnc_enabled | bool
              and ironic_vnc_container_provider == 'kubernetes'
            )
            else omit
          }}
        kubernetes_pod_timeout: >-
          {{
            ironic_vnc_kubernetes_pod_timeout
            if (
              ironic_vnc_enabled | bool
              and ironic_vnc_container_provider == 'kubernetes'
            )
            else omit
          }}
    rabbitmq:
      policies:
        - vhost: "ironic"
          name: "ha_ttl_ironic"
          definition:
            message-ttl: 70000
          priority: 0
          apply-to: all
          pattern: '^(?!(amq\.|reply_)).*'
  pod:
    labels:
      include_app_kubernetes_io: false
    affinity:
      anti:
        type:
          conductor: requiredDuringSchedulingIgnoredDuringExecution
    replicas:
      api: 3
      conductor: 3
  manifests:
    deployment_novncproxy: "{{ ironic_vnc_enabled | bool }}"
    ingress_api: false
    service_ingress_api: false
    # NOTE(mnaser): We're managing all the networks via Ansible.
    job_manage_cleaning_network: false
    service_novncproxy: "{{ ironic_vnc_enabled | bool }}"
    network_policy_console: >-
      {{
        (ironic_vnc_enabled | bool)
        and (ironic_vnc_network_policy_enabled | bool)
        and ironic_vnc_container_provider == 'kubernetes'
      }}
    role_console_pods: >-
      {{
        (ironic_vnc_enabled | bool)
        and ironic_vnc_container_provider == 'kubernetes'
      }}
    rolebinding_console_pods: >-
      {{
        (ironic_vnc_enabled | bool)
        and ironic_vnc_container_provider == 'kubernetes'
      }}

_ironic_novncproxy_ingress_annotations:
  nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
