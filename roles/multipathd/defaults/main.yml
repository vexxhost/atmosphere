# Allow usage of user friendly names only for "multipathd" CLI
#
# NOTE(mnaser): This defaults to "true" in the "multipathd" package however it
#               will break online volume expansion.  It is recommended to set
#               this to "false" to avoid issues with volume expansion.
#
#               See: https://bugs.launchpad.net/kolla-ansible/+bug/1982777
multipathd_user_friendly_names: false
# Keep the generic role aligned with Trident SAN host preparation, including
# when the OpenStack playbook runs without the CSI playbook's role defaults.
#
# multipathd_find_multipaths: "yes"
multipathd_find_multipaths: >-
  {{
    trident_csi_multipath_find_multipaths |
    default(_trident_csi_multipath_defaults.find_multipaths)
    if (
      csi_driver | default('') == 'trident' and
      trident_csi_configure_san | default(
        trident_csi_storage_driver |
        default(_trident_csi_multipath_defaults.storage_driver) in
        (trident_csi_san_storage_drivers |
         default(_trident_csi_multipath_defaults.san_storage_drivers))
      ) | bool and
      trident_csi_configure_multipath |
      default(_trident_csi_multipath_defaults.configure_multipath) | bool
    ) else 'yes'
  }}

# Local disk WWIDs to exclude from multipath mapping on this host.
#
# multipathd_blacklist_wwids:
#   - "3600508b1001c5e8f0000000000000001"
multipathd_blacklist_wwids: []
multipathd_repository: "ppa:vexxhost/backports"
