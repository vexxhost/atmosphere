- name: Verify state of current RabbitMQ cluster
  kubernetes.core.k8s_info:
    api_version: rabbitmq.com/v1beta1
    kind: RabbitmqCluster
    name: "rabbitmq-{{ rabbitmq_cluster_name }}"
    namespace: openstack
  register: _rabbitmq_cluster

- name: Assert that the RabbitMQ cluster can be upgraded directly
  when:
    - _rabbitmq_cluster.resources | length > 0
    - _rabbitmq_current_series | length > 0
    - _rabbitmq_target_series | length > 0
  ansible.builtin.assert:
    that:
      - _rabbitmq_current_series in _rabbitmq_upgrade_paths.get(_rabbitmq_target_series, [_rabbitmq_target_series])
    fail_msg: >-
      The RabbitMQ cluster "rabbitmq-{{ rabbitmq_cluster_name }}" runs RabbitMQ {{ _rabbitmq_current_series }},
      which cannot be upgraded directly to RabbitMQ {{ _rabbitmq_target_series }}. Upgrade to the previous
      Atmosphere release first.
    quiet: true

- name: Wait for confirmation if RabbitMQ cluster spec doesn't match
  when:
    - not rabbitmq_skip_spec_diff | bool
    - _rabbitmq_cluster.resources | length > 0
    - _rabbitmq_cluster.resources[0].spec != _rabbitmq_merged_spec
  vars:
    _rabbitmq_merged_spec: "{{ _rabbitmq_spec | combine(rabbitmq_spec, recursive=True) }}"
  block:
    - name: Print diff of RabbitMQ cluster spec
      ansible.utils.fact_diff:
        before: "{{ _rabbitmq_cluster.resources[0].spec }}"
        after: "{{ _rabbitmq_merged_spec }}"

    - name: Wait for confirmation of RabbitMQ cluster spec
      ansible.builtin.pause:

- name: Enable all feature flags for upgrade
  when:
    - _rabbitmq_cluster.resources | length > 0
    - _rabbitmq_cluster.resources[0].spec.image != _rabbitmq_merged_spec.image
  vars:
    _rabbitmq_merged_spec: "{{ _rabbitmq_spec | combine(rabbitmq_spec, recursive=True) }}"
  kubernetes.core.k8s_exec:
    namespace: openstack
    pod: "rabbitmq-{{ rabbitmq_cluster_name }}-server-0"
    command: rabbitmqctl enable_feature_flag all

# NOTE: RabbitMQ 4.3 and later only support the Khepri metadata store, so
#       migrate to it while the cluster still runs the previous release.
- name: Switch the RabbitMQ metadata store to Khepri before upgrading
  when:
    - _rabbitmq_cluster.resources | length > 0
    - _rabbitmq_cluster.resources[0].spec.image != _rabbitmq_merged_spec.image
    - _rabbitmq_target_series | length > 0
    - _rabbitmq_target_series is version('4.3', '>=')
  vars:
    _rabbitmq_merged_spec: "{{ _rabbitmq_spec | combine(rabbitmq_spec, recursive=True) }}"
  block:
    - name: Enable the Khepri metadata store
      kubernetes.core.k8s_exec:
        namespace: openstack
        pod: "rabbitmq-{{ rabbitmq_cluster_name }}-server-0"
        command: rabbitmqctl enable_feature_flag khepri_db

    - name: Assert that the Khepri metadata store is enabled
      kubernetes.core.k8s_exec:
        namespace: openstack
        pod: "rabbitmq-{{ rabbitmq_cluster_name }}-server-0"
        command: rabbitmqctl list_feature_flags --silent --formatter json name state
      register: _rabbitmq_feature_flags
      changed_when: false
      failed_when: >-
        (_rabbitmq_feature_flags.stdout | from_json | selectattr('name', 'equalto', 'khepri_db')
         | map(attribute='state') | first | default('')) != 'enabled'

- name: Deploy cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      metadata:
        name: "rabbitmq-{{ rabbitmq_cluster_name }}"
        namespace: openstack
      spec: "{{ _rabbitmq_spec | combine(rabbitmq_spec, recursive=True) }}"
    wait: true
    wait_timeout: 600
    wait_condition:
      type: ClusterAvailable
      status: "True"
  register: _rabbitmq_cluster_deployment
  retries: 3
  delay: 5
  until: _rabbitmq_cluster_deployment is not failed

# NOTE: Feature flags introduced by a release can only be enabled once every
#       node runs it. Until then the cluster stays in a compatibility mode in
#       which, for example, auto-delete exchanges are not recorded, so fanout
#       RPC messages (such as the volume service's capacity reports to the
#       Block Storage scheduler) are silently dropped after an upgrade.
- name: Enable the feature flags of the new RabbitMQ release
  when:
    - _rabbitmq_cluster.resources | length > 0
    - _rabbitmq_cluster.resources[0].spec.image != _rabbitmq_merged_spec.image
  vars:
    _rabbitmq_merged_spec: "{{ _rabbitmq_spec | combine(rabbitmq_spec, recursive=True) }}"
  block:
    - name: Wait for every RabbitMQ node to run the new release
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: "rabbitmq-{{ rabbitmq_cluster_name }}-server"
        namespace: openstack
      register: _rabbitmq_statefulset
      retries: 120
      delay: 10
      until:
        - _rabbitmq_statefulset.resources | length > 0
        - _rabbitmq_statefulset.resources[0].status.updateRevision is defined
        - _rabbitmq_statefulset.resources[0].status.currentRevision | default('') == _rabbitmq_statefulset.resources[0].status.updateRevision
        - _rabbitmq_statefulset.resources[0].status.updatedReplicas | default(0) == _rabbitmq_statefulset.resources[0].spec.replicas
        - _rabbitmq_statefulset.resources[0].status.readyReplicas | default(0) == _rabbitmq_statefulset.resources[0].spec.replicas

    - name: Enable all feature flags
      kubernetes.core.k8s_exec:
        namespace: openstack
        pod: "rabbitmq-{{ rabbitmq_cluster_name }}-server-0"
        command: rabbitmqctl enable_feature_flag all
      register: _rabbitmq_enable_feature_flags
      retries: 30
      delay: 10
      until: _rabbitmq_enable_feature_flags is not failed

    - name: Assert that every stable feature flag is enabled
      kubernetes.core.k8s_exec:
        namespace: openstack
        pod: "rabbitmq-{{ rabbitmq_cluster_name }}-server-0"
        command: rabbitmqctl list_feature_flags --silent --formatter json name state stability
      register: _rabbitmq_feature_flags_after
      changed_when: false
      failed_when: >-
        _rabbitmq_feature_flags_after.stdout | from_json
        | selectattr('stability', 'equalto', 'stable')
        | rejectattr('state', 'equalto', 'enabled')
        | list | length > 0
