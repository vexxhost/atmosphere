---
- name: Install Trident NFS client tools
  ansible.builtin.package:
    name: "{{ trident_csi_nfs_packages[ansible_os_family] }}"
    state: present
  when: trident_csi_access_protocol == 'nfs'

- name: Install Trident SAN host packages
  ansible.builtin.package:
    name: "{{ _trident_csi_san_package_names }}"
    state: present
  when: trident_csi_configure_san | bool
  vars:
    _trident_csi_san_protocol_packages: >-
      {{ trident_csi_san_packages[trident_csi_access_protocol] }}
    _trident_csi_san_package_names: >-
      {{
        _trident_csi_san_protocol_packages[ansible_os_family] |
        default(_trident_csi_san_protocol_packages.default)
      }}

- name: Configure Trident SAN multipathing
  ansible.builtin.include_role:
    name: multipathd
  when:
    - trident_csi_configure_san | bool
    - trident_csi_configure_multipath | bool

- name: Prepare iSCSI initiator
  ansible.builtin.import_tasks: iscsi.yml
  when: trident_csi_configure_iscsi | bool

- name: Prepare NVMe initiator
  ansible.builtin.import_tasks: nvme.yml
  when:
    - trident_csi_configure_san | bool
    - trident_csi_access_protocol == 'nvme'

- name: Check unique Trident host identifiers
  run_once: true
  ansible.builtin.assert:
    that:
      - _trident_csi_identifiers | length == _trident_csi_identifiers | unique | length
    fail_msg: >-
      Duplicate {{ item.protocol }} host identifiers found among
      {{ ansible_play_hosts_all | join(', ') }}. Assign a unique identifier
      to each node before installing Trident.
  loop:
    - protocol: iSCSI
      fact: _trident_csi_iscsi_initiator
    - protocol: NVMe
      fact: _trident_csi_nvme_hostnqn
  loop_control:
    label: "{{ item.protocol }}"
  vars:
    _trident_csi_identifiers: >-
      {{ ansible_play_hosts_all | map('extract', hostvars) |
         selectattr(item.fact, 'defined') | map(attribute=item.fact) | list }}

- name: Start Trident SAN services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ _trident_csi_san_service_names }}"
  when: trident_csi_configure_san | bool
  vars:
    _trident_csi_san_protocol_services: >-
      {{ trident_csi_san_services[trident_csi_access_protocol] }}
    _trident_csi_san_service_names: >-
      {{
        _trident_csi_san_protocol_services[ansible_os_family] |
        default(_trident_csi_san_protocol_services.default)
      }}

- name: Apply Trident host configuration before installing the operator
  ansible.builtin.meta: flush_handlers
