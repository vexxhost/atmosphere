---
- name: Validate Trident host configuration
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_os_family in ['Debian', 'RedHat']
      - trident_csi_storage_driver in trident_csi_supported_storage_drivers
      - trident_csi_access_protocol in trident_csi_supported_access_protocols
      - trident_csi_access_protocol != 'nvme' or ansible_os_family != 'RedHat' or ansible_distribution_major_version | int >= 9
    fail_msg: Select a supported Trident driver and Linux protocol (iscsi, fc, nvme, or nfs).

- name: Validate Trident storage driver access protocol
  ansible.builtin.assert:
    that:
      - >-
        (
          trident_csi_storage_driver in trident_csi_san_storage_drivers and
          trident_csi_access_protocol in trident_csi_san_access_protocols
        ) or (
          trident_csi_storage_driver in trident_csi_nas_storage_drivers and
          trident_csi_access_protocol in trident_csi_nas_access_protocols
        )
      - >-
        trident_csi_access_protocol != 'fc' or
        trident_csi_storage_driver in trident_csi_fc_storage_drivers
      - >-
        trident_csi_access_protocol != 'nvme' or
        trident_csi_storage_driver in trident_csi_nvme_storage_drivers
    fail_msg: >-
      The selected trident_csi_access_protocol is not supported by
      trident_csi_storage_driver.

- name: Validate NVMe backend API
  ansible.builtin.assert:
    that:
      - trident_csi_access_protocol != 'nvme' or _trident_csi_backend_options.useREST | bool
    fail_msg: NVMe backends require useREST enabled.

- name: Validate Trident SAN array selection
  ansible.builtin.assert:
    that:
      - "'netapp_ontap' in (multipathd_arrays | default([]))"
      - (multipathd_find_multipaths | default('no') | string) == 'no'
    fail_msg: >-
      Add netapp_ontap to multipathd_arrays in inventory for every Trident SAN
      node, alongside any other arrays used by that host. Trident requires
      multipathd_find_multipaths: "no".
  when: trident_csi_storage_driver in trident_csi_san_storage_drivers
