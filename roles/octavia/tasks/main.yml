- name: Generate resources
  ansible.builtin.import_tasks:
    file: generate_resources.yml

- name: Create CAs & Issuers
  kubernetes.core.k8s:
    state: present
    definition:
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: "{{ item }}-ca"
          namespace: openstack
        spec:
          isCA: true
          commonName: "{{ octavia_tls_server_common_name if item == 'octavia-server' else octavia_tls_client_common_name }}"
          secretName: "{{ item }}-ca"
          duration: 87600h0m0s
          renewBefore: 720h0m0s
          privateKey: "{{ private_key | from_yaml }}"
          issuerRef:
            name: self-signed
            kind: ClusterIssuer
            group: cert-manager.io

      - apiVersion: cert-manager.io/v1
        kind: Issuer
        metadata:
          name: "{{ item }}"
          namespace: openstack
        spec:
          ca:
            secretName: "{{ item }}-ca"
  vars:
    # NOTE(mnaser): Unfortuantely, Ansible renders all variables as strings so
    #               we do this workaround to make sure the size is an integer.
    private_key: |
      algorithm: "{{ octavia_tls_server_private_key_algorithm if item == 'octavia-server' else octavia_tls_client_private_key_algorithm }}"
      size: {{ octavia_tls_server_private_key_size if item == 'octavia-server' else octavia_tls_client_private_key_size }}
  loop:
    - octavia-client
    - octavia-server

- name: Create certificate for Octavia clients
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: octavia-client-certs
        namespace: openstack
      spec:
        commonName: "{{ octavia_tls_client_common_name }}"
        secretName: octavia-client-certs
        additionalOutputFormats:
          - type: CombinedPEM
        duration: 87600h0m0s
        renewBefore: 720h0m0s
        privateKey: "{{ private_key | from_yaml }}"
        issuerRef:
          name: octavia-client
          kind: Issuer
          group: cert-manager.io
  vars:
    # NOTE(mnaser): Unfortuantely, Ansible renders all variables as strings so
    #               we do this workaround to make sure the size is an integer.
    private_key: |
      algorithm: "{{ octavia_tls_client_private_key_algorithm }}"
      size: {{ octavia_tls_client_private_key_size }}

- name: Ensure unlimited admin project quotas
  vars:
    _octavia_admin_quota_resources:
      - instances
      - cores
      - ram
      - volumes
      - gigabytes
      - secgroups
      - secgroup-rules
    _octavia_admin_quota_limits: >-
      {{ _octavia_admin_quota_show.stdout | from_json | items2dict(key_name='Resource', value_name='Limit') }}
    _octavia_admin_quota_needs_update: >-
      {{ _octavia_admin_quota_resources | map('extract', _octavia_admin_quota_limits) | map('int') | reject('equalto', -1) | list | length > 0 }}
  block:
    - name: Read admin project quotas
      ansible.builtin.command:
        argv: [openstack, --os-cloud, atmosphere, quota, show, --all, -f, json, admin]
      register: _octavia_admin_quota_show
      changed_when: false
      check_mode: false
      retries: 60
      delay: 5
      until: _octavia_admin_quota_show is succeeded

    - name: Validate admin project quota output
      ansible.builtin.assert:
        that:
          - _octavia_admin_quota_resources | difference(_octavia_admin_quota_limits.keys()) | length == 0
          - >-
            _octavia_admin_quota_resources | map('extract', _octavia_admin_quota_limits) | map('string')
            | select('match', '^-?[0-9]+$') | list | length == _octavia_admin_quota_resources | length
        fail_msg: The OpenStack CLI did not return all required numeric quota limits.
        quiet: true

    - name: Report pending admin project quota changes
      ansible.builtin.debug:
        msg: The admin project quotas will be set to unlimited.
      changed_when: true
      when:
        - ansible_check_mode
        - _octavia_admin_quota_needs_update | bool

    - name: Set unlimited admin project quotas
      ansible.builtin.command:
        argv:
          - openstack
          - --os-cloud
          - atmosphere
          - quota
          - set
          - --instances
          - "-1"
          - --cores
          - "-1"
          - --ram
          - "-1"
          - --volumes
          - "-1"
          - --gigabytes
          - "-1"
          - --secgroups
          - "-1"
          - --secgroup-rules
          - "-1"
          - admin
      register: _octavia_admin_quota_set
      changed_when: true
      when:
        - not ansible_check_mode
        - _octavia_admin_quota_needs_update | bool
      retries: 60
      delay: 5
      until: _octavia_admin_quota_set is succeeded

    - name: Verify unlimited admin project quotas
      ansible.builtin.command:
        argv: [openstack, --os-cloud, atmosphere, quota, show, --all, -f, json, admin]
      vars:
        _octavia_admin_quota_verified_limits: >-
          {{ _octavia_admin_quota_verify.stdout | from_json | items2dict(key_name='Resource', value_name='Limit') }}
      register: _octavia_admin_quota_verify
      changed_when: false
      when:
        - not ansible_check_mode
        - _octavia_admin_quota_set is changed
      retries: 60
      delay: 5
      until:
        - _octavia_admin_quota_verify is succeeded
        - _octavia_admin_quota_resources | difference(_octavia_admin_quota_verified_limits.keys()) | length == 0
        - >-
          _octavia_admin_quota_resources | map('extract', _octavia_admin_quota_verified_limits) | map('string')
          | select('equalto', '-1') | list | length == _octavia_admin_quota_resources | length

- name: Deploy Helm chart
  run_once: true
  kubernetes.core.helm:
    name: "{{ octavia_helm_release_name }}"
    chart_ref: "{{ octavia_helm_chart_ref }}"
    release_namespace: "{{ octavia_helm_release_namespace }}"
    create_namespace: true
    kubeconfig: "{{ octavia_helm_kubeconfig }}"
    timeout: "{{ octavia_helm_timeout }}"
    values: "{{ _octavia_helm_values | combine(octavia_helm_values, recursive=True) }}"

- name: Add implied roles
  run_once: true
  ansible.builtin.command:
    cmd: >-
      openstack implied role create
      --implied-role {{ item.implies }}
      {{ item.role }}
  loop:
    - role: member
      implies: load-balancer_member
    - role: reader
      implies: load-balancer_observer
  environment:
    OS_CLOUD: atmosphere
  register: _octavia_implied_role_create
  changed_when: _octavia_implied_role_create.rc == 0
  failed_when: _octavia_implied_role_create.rc != 0 and 'Duplicate entry.' not in _octavia_implied_role_create.stderr
  retries: 10
  delay: 1
  until: _octavia_implied_role_create.rc == 0 or 'Duplicate entry.' in _octavia_implied_role_create.stderr

- name: Create Ingress
  ansible.builtin.include_role:
    name: openstack_helm_ingress
  vars:
    openstack_helm_ingress_endpoint: load_balancer
    openstack_helm_ingress_service_name: octavia-api
    openstack_helm_ingress_service_port: 9876
    openstack_helm_ingress_annotations: "{{ octavia_ingress_annotations }}"
    openstack_helm_ingress_class_name: "{{ octavia_ingress_class_name }}"
