__cinder_helm_values:
  endpoints: "{{ openstack_helm_endpoints }}"
  images:
    tags: "{{ atmosphere_images | vexxhost.atmosphere.openstack_helm_image_tags('cinder') }}"
  pod:
    labels:
      include_app_kubernetes_io: false
    replicas:
      api: 3
      volume: "{{ cinder_volume_replicas }}"
      scheduler: 3
      backup: "{{ cinder_backup_replicas }}"
    mounts:
      cinder_api:
        cinder_api:
          volumeMounts:
            - name: cinder-coordination-tls
              mountPath: "{{ cinder_coordination_tls_path }}"
              readOnly: true
          volumes:
            - name: cinder-coordination-tls
              secret:
                secretName: "{{ cinder_coordination_secret_name }}"
      cinder_scheduler:
        cinder_scheduler:
          volumeMounts:
            - name: cinder-coordination-tls
              mountPath: "{{ cinder_coordination_tls_path }}"
              readOnly: true
          volumes:
            - name: cinder-coordination-tls
              secret:
                secretName: "{{ cinder_coordination_secret_name }}"
      cinder_backup:
        cinder_backup:
          volumeMounts:
            - name: cinder-coordination-tls
              mountPath: "{{ cinder_coordination_tls_path }}"
              readOnly: true
          volumes:
            - name: cinder-coordination-tls
              secret:
                secretName: "{{ cinder_coordination_secret_name }}"
      cinder_volume:
        cinder_volume:
          volumeMounts:
            - name: cinder-tmp
              mountPath: /var/lib/cinder/tmp
            - name: cinder-coordination-tls
              mountPath: "{{ cinder_coordination_tls_path }}"
              readOnly: true
          volumes:
            - name: cinder-tmp
              emptyDir: {}
            - name: cinder-coordination-tls
              secret:
                secretName: "{{ cinder_coordination_secret_name }}"
    security_context:
      cinder_volume:
        container:
          cinder_volume:
            privileged: true

  conf:
    policy: {}
    cinder:
      DEFAULT:
        allowed_direct_url_schemes: cinder
        cluster: "{{ cinder_volume_cluster_name }}"
        host: null
        log_config_append: null
        os_region_name: "{{ openstack_helm_endpoints['identity']['auth']['cinder']['region_name'] }}"
        volume_usage_audit_period: hour
        volume_name_template: volume-%s
        osapi_volume_workers: 8
      barbican:
        barbican_endpoint_type: internal
      cors:
        allowed_origins: "*"
      database:
        connection_recycle_time: 600
        max_overflow: 50
        max_pool_size: 5
        pool_timeout: 30
      coordination:
        backend_url: "{{ cinder_coordination_backend_url }}"
      oslo_messaging_notifications:
        driver: noop
      privsep_osbrick:
        helper_command: sudo cinder-rootwrap /etc/cinder/rootwrap.conf privsep-helper --config-file /etc/cinder/cinder.conf
    rabbitmq:
      policies:
        - vhost: "cinder"
          name: "ha_ttl_cinder"
          definition:
            message-ttl: 70000
          priority: 0
          apply-to: all
          pattern: '^(?!(amq\.|reply_)).*'
  manifests:
    deployment_backup: false
    deployment_volume: false
    ingress_api: false
    job_clean: false
    service_ingress_api: false
    statefulset_backup: true
    statefulset_volume: true

__cinder_staffeln_helm_values:
  conf:
    policy:
      backup:delete: "rule:admin_api or (project_id:%(project_id)s and http://staffeln-api:8808/v1/backup?backup_id=%(id)s)"

_cinder_ingress_annotations:
  nginx.ingress.kubernetes.io/proxy-body-size: "0"
  nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
