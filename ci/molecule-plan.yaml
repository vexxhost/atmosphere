      - compute

  coredns:
    requires:
      - kubernetes
    jobs:
      - aio-openvswitch
    verification_profiles:
      - network

  nova:
    requires:
      - glance
      - libvirt
      - placement
    test_requires:
      - neutron
    jobs:
      - aio-openvswitch
    verification_profiles:
      - compute
    tempest_tests:
      - '^tempest\.api\.compute\.'
      - '^tempest\.scenario\.test_server_'

  neutron:
    requires:
      - nova
    backend_requires:
      openvswitch:
        - coredns
        - openvswitch
      ovn:
        - ovn
    jobs:
      - aio-openvswitch
      - aio-ovn
    verification_profiles:
