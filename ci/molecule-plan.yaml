  heat:
    requires:
      - keystone
    test_requires:
      - glance
      - neutron
    jobs:
      - aio-openvswitch
    verification_profiles:
      - orchestration

  octavia:
    requires:
      - barbican
      - neutron
      - nova
    jobs:
      - aio-openvswitch
    verification_profiles:
      - load-balancer
    tempest_tests:
      - '^octavia_tempest_plugin\.'

  magnum:
