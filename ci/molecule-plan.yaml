    tempest_tests:
      - '^tempest\.api\.image\.'

  staffeln:
    requires:
      - keystone
    jobs:
      - aio-openvswitch
    verification_profiles:
      - volume

  cinder:
    requires:
      - ceph-provisioners
      - keystone
    test_requires:
      - glance
    jobs:
      - aio-openvswitch
    verification_profiles:
      - volume
    tempest_tests:
      - '^tempest\.api\.volume\.'

  placement:
    requires:
      - keystone
    jobs:
      - aio-openvswitch
    verification_profiles:
      - placement

  openvswitch:
    requires:
      - kubernetes
    jobs:
      - aio-openvswitch
    verification_profiles:
