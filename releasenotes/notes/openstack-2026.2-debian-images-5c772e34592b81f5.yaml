---
upgrade:
  - |
    The OpenStack service images are now built for OpenStack 2026.2. Upgrade
    to the previous release first, since OpenStack 2026.2 does not support
    upgrading directly from 2025.2.
  - |
    The Compute conductor and compute services now run with native threads
    by default, following the upstream default for OpenStack 2026.2.
  - |
    The Compute service no longer supports Linux bridge networking. Deployments
    migrated from OpenStack-Ansible that still use Linux bridge must move to
    Open vSwitch or OVN before upgrading, since instances on Linux bridge
    ports fail to start on upgraded compute nodes.
