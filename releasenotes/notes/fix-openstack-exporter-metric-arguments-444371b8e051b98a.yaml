---
fixes:
  - |
    Metric exclusions now take effect in the OpenStack exporter, avoiding
    unnecessary API requests that can cause scrapes to time out.
upgrade:
  - |
    If you override ``openstack_exporter_args`` or
    ``openstack_exporter_neutron_disabled_metrics``, write each metric
    exclusion as ``--disable-metric=<name>``. Entries written as
    ``-d <name>`` have no effect.
