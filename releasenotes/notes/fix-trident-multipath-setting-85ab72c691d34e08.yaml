---
fixes:
  - |
    Keep the generic ``multipathd`` role aligned with Trident SAN's
    ``find_multipaths`` setting so OpenStack host configuration no longer
    resets it to ``yes`` after CSI deployment. The generic role now exposes
    ``multipathd_find_multipaths`` and defaults to Trident's setting when
    Trident SAN host preparation and multipath configuration are enabled.
