---
features:
  - |
    Kubernetes upgrades prepare Cilium compatibility before controller changes
    and protect Node Feature Discovery publication and Percona peer discovery
    during each controller operation. Temporary changes are restored after
    failures, with host recovery watchdogs if the deployer disconnects.
upgrade:
  - |
    Install the companion Kubernetes collection changes before using the
    single-playbook minor upgrade workflow. Set
    ``atmosphere_kubernetes_version`` to one exact release in the next minor
    and run ``vexxhost.atmosphere.kubernetes`` for the complete inventory.
    Prepare required etcd and runtime intermediates separately, and retain
    checkpoint and resize safeguards on affected releases.
