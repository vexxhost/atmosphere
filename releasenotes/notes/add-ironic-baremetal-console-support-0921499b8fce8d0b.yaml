---
features:
  - |
    Add optional graphical console support for Ironic bare metal nodes. When
    ``ironic_baremetal_console_enabled`` is enabled and
    ``ironic_baremetal_console_image`` is set, Atmosphere deploys an
    ``ironic-novncproxy`` endpoint and configures Ironic's Kubernetes console
    container provider for the ``redfish-graphical`` console interface. The
    feature is disabled by default and retains the ``no-console`` interface for
    drivers that do not provide graphical consoles.

    Operators can also use ``ironic_enabled_hardware_types`` and
    ``ironic_enabled_network_interfaces`` to register additional Ironic
    hardware types and network interfaces required by their deployment.
