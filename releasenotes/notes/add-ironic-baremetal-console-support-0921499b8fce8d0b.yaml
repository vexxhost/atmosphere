---
features:
  - |
    Bare metal nodes now have a browser-based graphical console, enabled by
    default whenever Ironic is deployed. Atmosphere runs ``ironic-novncproxy``
    as an internal service and a console image that opens the BMC's web
    console for Dell iDRAC, HPE iLO and Supermicro servers. Users reach
    consoles for their bare metal instances through Nova's existing console
    proxy.
security:
  - |
    Console Pods run in their own namespace under the restricted Pod Security
    Standard, as a non-root user with no service account token, and can only
    make outbound DNS and HTTP(S) connections. Only the Ironic and Nova console
    proxies can connect to them.
upgrade:
  - |
    Existing nodes keep their current console interface. Switch them to
    graphical consoles with
    ``openstack baremetal node set --console-interface redfish-graphical``.
