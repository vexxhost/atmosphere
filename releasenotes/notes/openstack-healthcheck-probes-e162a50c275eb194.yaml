---
fixes:
  - |
    The API probes for Barbican, Cinder, Designate, Glance, Heat API and
    CloudFormation, Keystone, Magnum, Manila, Neutron, Nova, and Octavia now
    use the ``oslo.middleware`` ``/healthcheck`` endpoint. The disable file
    uses the writable ``/tmp`` volume, and the Glance and Neutron probes
    report HTTP errors when TLS is enabled.
