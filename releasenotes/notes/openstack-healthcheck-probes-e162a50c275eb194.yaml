---
fixes:
  - |
    The API probes for Barbican, Cinder, Glance, Heat API and CloudFormation,
    Magnum, Neutron, and Nova now use the ``oslo.middleware`` ``/healthcheck``
    endpoint. The disable file uses the writable ``/tmp`` volume, and the
    Glance and Neutron probes report HTTP errors when TLS is enabled.
