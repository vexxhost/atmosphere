---
fixes:
  - |
    The ``ovn-bgp-agent`` now uses the ``frr_k8s`` routing driver when
    ``ovn_bgp_agent_enabled`` is set. Atmosphere configured it with the
    ``[DEFAULT] bgp_driver`` option, which the agent no longer recognizes,
    so the agent silently fell back to the ``frr`` driver. The option is
    now ``[DEFAULT] routing_driver``.
