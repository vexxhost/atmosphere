---
upgrade:
  - |
    The Percona XtraDB Cluster operator is upgraded from 1.18.0 to 1.19.1,
    with Percona XtraDB Cluster 8.0.44, XtraBackup 8.0.35-34.1 and HAProxy
    2.8.17. The operator only supports upgrades to the next minor version, so
    this release must be deployed before upgrading to the next major release.
    The deployment now stops before upgrading an operator that is more than
    one minor version behind.
