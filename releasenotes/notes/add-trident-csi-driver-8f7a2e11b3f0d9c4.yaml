---
features:
  - |
    Added NetApp Trident CSI support for iSCSI, Fibre Channel, NVMe/TCP, NFS,
    and SMB backends. Set ``csi_driver: trident`` to install the operator
    from a bundled Helm chart and create the ``general`` StorageClass.
    Images support the release manifest and registry mirrors. Autosupport
    reporting is silenced by default. Before enabling SAN multipathing,
    exclude local disks using host-specific ``multipathd_blacklist_wwids``.
