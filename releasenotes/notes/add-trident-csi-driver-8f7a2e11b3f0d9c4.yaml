---
features:
  - |
    Added NetApp Trident CSI support for iSCSI, Fibre Channel, NVMe/TCP and
    NFS backends. Set ``csi_driver: trident`` to install the operator from
    a bundled Helm chart and create the ``general`` StorageClass. Images
    support the release manifest and registry mirrors. Autosupport reporting
    is silenced by default. Trident runs on, and prepares, only the
    controllers, leaving compute nodes unchanged.
    For SAN backends, select ``netapp_ontap`` and any other required arrays
    in ``multipathd_arrays`` to protect local disks with device filtering.
