---
fixes:
  - |
    Upgraded the HPE CSI driver Helm chart and container images from ``3.1.0``
    to ``3.3.1``. This includes upstream fixes that stop the node monitor from
    removing active multipath maps during transient path loss and improve
    multipath device management. Operators who temporarily disabled the node
    monitor via ``disableNodeMonitor: true`` can remove that override after
    upgrading.
