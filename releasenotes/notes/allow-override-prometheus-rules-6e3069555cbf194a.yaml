---
features:
  - |
    Add ``kube_prometheus_stack_additional_rules_jsonnet_path`` for
    extending the bundled Prometheus rules with additional Jsonnet-generated
    ``PrometheusRule`` resources. Unique top-level keys add resources, while a
    matching key replaces only that bundled resource. The advanced
    ``kube_prometheus_stack_rules_jsonnet_path`` variable can replace the
    complete bundled rules map.
