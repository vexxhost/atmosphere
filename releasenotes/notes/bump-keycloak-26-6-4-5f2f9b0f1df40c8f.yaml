---
security:
  - |
    Upgrade Keycloak from ``24.0.5`` to ``26.6.4`` to include upstream
    security fixes released since the previous bundled version.
upgrade:
  - |
    Existing Keycloak installations are migrated from the Bitnami Helm
    release to the Keycloak Operator. As part of the upgrade, Keycloak data
    is migrated from Percona XtraDB Cluster (PXC) to PostgreSQL managed by
    CloudNativePG. Keycloak is unavailable while its data is exported,
    imported, and validated.
  - |
    Keycloak metrics are now scraped from the management interface on port
    ``9000``.
