name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - stable/*

permissions: {}

jobs:
  cargo:
    uses: vexxhost/github-actions/.github/workflows/cargo.yml@d240297ac3f2162871403fea1074360da43d4585 # main
    with:
      install-promtool: true

  chart-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: vexxhost/chart-vendor@3c91cecf08feb55ab66586b91b1a116b6cf0dbd9 # main

  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Install promtool
        env:
          PROMTOOL_VERSION: "2.53.4"
        run: |
          curl -L -s https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1
      - uses: robherley/go-test-action@b19f6aadabfb1ad85079065b21aa2af132466468 # v0.6.0
        with:
          testArguments: -timeout=20m ./...

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build
        with:
          pin-images: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: step-security/setup-uv@ccf0a26ce9117d9e99292b0ce953ea5d9ffe778e # v7.3.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Run Python unit tests
        run: |
          uv run --no-project --python 3.12 \
            --with 'ansible-core>=2.15.9' --with pytest --with pytest-ansible --with pyyaml \
            python -m pytest \
              tests/unit/plugins/filter/test_resolve_images.py \
              tests/unit/plugins/lookup/test_release_manifest.py \
              tests/unit/roles/test_multipathd.py

  trident-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: step-security/setup-uv@ccf0a26ce9117d9e99292b0ce953ea5d9ffe778e # v7.3.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          version: v0.30.0
          cluster_name: trident-smoke
          kubectl_version: v1.34.0
      - name: Install the Ansible smoke-test environment
        run: |
          uv venv "${RUNNER_TEMP}/trident-venv" --python 3.12
          uv pip install --python "${RUNNER_TEMP}/trident-venv/bin/python" \
            'ansible-core==2.18.6' kubernetes pyyaml jmespath
          echo "${RUNNER_TEMP}/trident-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trident-venv/bin/ansible-galaxy" collection install \
            kubernetes.core:2.4.0 vexxhost.kubernetes:3.5.0 \
            -p "${RUNNER_TEMP}/collections"
          mkdir -p "${RUNNER_TEMP}/collections/ansible_collections/vexxhost"
          ln -s "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/collections/ansible_collections/vexxhost/atmosphere"
      - name: Install and verify Trident without ONTAP
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: ansible-playbook -i localhost, molecule/csi/trident-smoke.yml
      - name: Collect Trident diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get tridentorchestrators -o yaml
          kubectl get events -n trident-smoke --sort-by=.lastTimestamp
          kubectl logs -n trident-smoke deployment/trident-operator --all-containers=true --tail=200

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: step-security/docker-login-action@c3e677aae8393bc9c81cfdf9709648720ea4bd4d # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release manifest tags
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vexxhost/atmosphere-release
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch

      # NOTE: Publish the release manifest that Zuul tested for the merged pull
      #       request when its image inputs match this commit; otherwise the
      #       manifest generated above is published and marked as untested.
      - name: Publish release manifest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t refs <<< "${TAGS}"
          lookup=()
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '([.[] | select(.merged_at != null)][0] // empty) | "\(.number) \(.head.sha)"' || true)
          if [ -n "${pr}" ]; then
            read -r change patchset <<< "${pr}"
            lookup=(--zuul-api https://zuul.oss.vexxhost.dev/api --change "${change}" --patchset "${patchset}")
          fi
          go run ./cmd/atmosphere-release publish --file "${RUNNER_TEMP}/release-manifest.yaml" "${lookup[@]}" "${refs[@]}"
