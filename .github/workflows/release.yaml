name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: step-security/docker-login-action@c3e677aae8393bc9c81cfdf9709648720ea4bd4d # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release manifest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vexxhost/atmosphere-release
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag

      # NOTE: The release ships exactly the manifest CI published for the
      #       released commit; no image is resolved again.
      - name: Promote release manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t refs <<< "${TAGS}"
          go run ./cmd/atmosphere-release promote --from "${GITHUB_SHA}" --generate-if-missing "${refs[@]}"
          go run ./cmd/atmosphere-release show "${refs[0]}" > "${RUNNER_TEMP}/release-manifest.yaml"

      - name: Attach atmosphere-release binaries and the release manifest
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.yaml

      # NOTE: Keep the GoReleaser output out of the Ansible collection.
      - name: Remove GoReleaser output
        run: rm -rf dist

      - uses: ./.github/actions/build
        with:
          manifest: ${{ runner.temp }}/release-manifest.yaml

      - uses: ansible/ansible-publish-action@a56a0328c92c1d4feedf5bd7f7cf7ec7a4ae3f09 # v1.0.0
        with:
          api_key: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
