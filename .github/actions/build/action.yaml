name: Build Atmosphere collection
description: Build Ansible collection for Atmosphere

inputs:
  pin-images:
    description: Pin images in the collection
    default: "true"
  manifest:
    description: >-
      Release manifest (file or OCI reference) to pin the images from. When
      empty, a manifest is generated from the source tree and written to
      $RUNNER_TEMP/release-manifest.yaml.
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
    - shell: bash
      run: uvx reno report --output CHANGELOG.rst

    - shell: bash
      run: |
        # Find all role directories
        ROLE_DIRS=$(find roles -mindepth 1 -maxdepth 1 -type d)

        # Initialize error flag
        MISSING_README=0

        # Check each role directory for README.md
        for ROLE in $ROLE_DIRS; do
          if [ ! -f "$ROLE/README.md" ]; then
            echo "::error::Missing README.md in role $ROLE"
            MISSING_README=1
          else
            echo "README.md found in $ROLE"
          fi
        done

        # Fail if any README.md is missing
        if [ $MISSING_README -ne 0 ]; then
          exit 1
        fi

    - shell: bash
      if: ${{ inputs.pin-images == 'true' && inputs.manifest == '' }}
      run: |
        go run ./cmd/atmosphere-release generate --write-vars --output "${RUNNER_TEMP}/release-manifest.yaml"
        cat ./roles/defaults/vars/main.yml

    - shell: bash
      if: ${{ inputs.pin-images == 'true' && inputs.manifest != '' }}
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        go run ./cmd/atmosphere-release write-vars "${MANIFEST}"
        cat ./roles/defaults/vars/main.yml
