- name: Prepare Molecule dependencies
  hosts: all
  become: true
  tasks:
    - name: Install jq for log collection
      when: ansible_facts["os_family"] | lower == "debian"
      ansible.builtin.apt:
        name: jq
        update_cache: true

- name: Install Go for the Atmosphere deployment binary
  hosts: all
  roles:
    - role: ensure-go
      go_version: "1.24.4"
