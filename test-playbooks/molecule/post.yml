- hosts: all
  become: true
  vars:
    work_dir: "{{ zuul.project.src_dir }}"
    logs_dir: "/tmp/logs"
  pre_tasks:
    - name: Check for selective CI plan
      ansible.builtin.stat:
        path: "{{ work_dir }}/ci-plan.json"
      register: _atmosphere_ci_plan

    - name: Create log directory for selective CI plan
      when: _atmosphere_ci_plan.stat.exists
      ansible.builtin.file:
        path: "{{ logs_dir }}"
        state: directory
        mode: "0755"

    - name: Include selective CI plan in job logs
      when: _atmosphere_ci_plan.stat.exists
      ansible.builtin.copy:
        src: "{{ work_dir }}/ci-plan.json"
        dest: "{{ logs_dir }}/ci-plan.json"
        remote_src: true
        mode: "0644"
  roles:
    - gather-host-logs
    - helm-release-status
    - describe-kubernetes-objects
    - gather-pod-logs
    - gather-prom-metrics
    - gather-selenium-data
